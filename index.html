<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تيك توك - شاهد واكسب</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* App Header */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }

    .app-header * {
      pointer-events: auto;
    }

    .reward-badge {
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #ffd700;
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: #ffd700;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .reward-badge.pop {
      transform: scale(1.25);
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    /* Video Feed Container */
    .feed-container {
      height: 100vh;
      width: 100vw;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    .feed-container::-webkit-scrollbar {
      display: none;
    }

    /* Video Card */
    .video-card {
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe, video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
    }

    /* Video Overlay & Controls */
    .video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .video-overlay * {
      pointer-events: auto;
    }

    .side-bar {
      position: absolute;
      left: 15px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #fff;
      cursor: pointer;
    }

    .action-item i {
      font-size: 28px;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
      transition: transform 0.2s;
    }

    .action-item i.active {
      color: #ff0050;
    }

    .action-item:active i {
      transform: scale(0.8);
    }

    .action-item span {
      font-size: 12px;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .video-info {
      position: absolute;
      right: 15px;
      bottom: 90px;
      max-width: 75%;
      z-index: 10;
    }

    .username {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .description {
      font-size: 14px;
      line-height: 1.4;
      opacity: 0.9;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Progress bar for reward */
    .watch-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 4px;
      background: #ffd700;
      width: 0%;
      transition: width 0.1s linear;
      z-index: 15;
    }

    /* Navigation Bar */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #000;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: rgba(255,255,255,0.6);
      font-size: 10px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #fff;
    }

    .nav-item i {
      font-size: 20px;
    }

    .add-btn {
      width: 45px;
      height: 28px;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 50%, #ff0050 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 16px;
      font-weight: bold;
    }

    /* Modal / Bottom Sheet */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      background: #181818;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #ccc;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #ff0050;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Floating Toast Notification */
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #ffd700;
      color: #000;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 300;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Floating Toast -->
  <div class="toast" id="toast">
    <i class="fas fa-coins"></i>
    <span>حصلت على 1 دينار!</span>
  </div>

  <!-- Header -->
  <div class="app-header">
    <div class="reward-badge" id="rewardBadge">
      <i class="fas fa-wallet"></i>
      <span id="balanceText">0</span>
      <span>د.ع</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="syncSheets()"><i class="fas fa-sync-alt"></i></button>
      <button class="icon-btn" onclick="openModal('settingsModal')"><i class="fas fa-cog"></i></button>
    </div>
  </div>

  <!-- Video Feed -->
  <div class="feed-container" id="feedContainer"></div>

  <!-- Bottom Navigation -->
  <div class="nav-bar">
    <div class="nav-item active">
      <i class="fas fa-home"></i>
      <span>الرئيسية</span>
    </div>
    <div class="nav-item" onclick="openModal('uploadModal')">
      <div class="add-btn"><i class="fas fa-plus"></i></div>
    </div>
    <div class="nav-item" onclick="openModal('settingsModal')">
      <i class="fas fa-table"></i>
      <span>الشيت</span>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>إضافة فيديو أو صورة جديدة</h3>
        <i class="fas fa-times" onclick="closeModal('uploadModal')" style="cursor:pointer"></i>
      </div>
      <div class="form-group">
        <label>الرابط (يوتيوب أو صورة/فيديو)</label>
        <input type="text" id="inputUrl" class="form-control" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>اسم المستخدم (العمود B)</label>
        <input type="text" id="inputUser" class="form-control" placeholder="@username">
      </div>
      <div class="form-group">
        <label>حالة التوثيق: 1 (موثق) أو 0 (عادي)</label>
        <input type="number" id="inputVerified" class="form-control" value="0" min="0" max="1">
      </div>
      <button class="btn-submit" onclick="addManualPost()">نشر الآن</button>
    </div>
  </div>

  <!-- Settings / Sheets Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>إعدادات Google Sheet</h3>
        <i class="fas fa-times" onclick="closeModal('settingsModal')" style="cursor:pointer"></i>
      </div>
      <p style="font-size:13px; color:#aaa; margin-bottom:15px; line-height:1.5">
        العمود A: رابط الفيديو/الصورة<br>
        العمود B: اسم المستخدم<br>
        العمود C: 1 موثق أو 0 عادي
      </p>
      <div class="form-group">
        <label>رابط الـ CSV الخاص بالشيت</label>
        <input type="text" id="sheetUrlInput" class="form-control" value="https://docs.google.com/spreadsheets/d/10UZ1ZO44YV_zVBv10HB04n_CoCZ9LgOOiGhDdnr7_hg/pub?output=csv">
      </div>
      <button class="btn-submit" onclick="saveSheetUrl()">حفظ وتحديث الفيديوهات</button>
    </div>
  </div>

  <script>
    let balance = parseInt(localStorage.getItem('user_balance') || '0');
    let watchedSet = new Set(JSON.parse(localStorage.getItem('watched_videos') || '[]'));
    let DEFAULT_CSV = "https://docs.google.com/spreadsheets/d/10UZ1ZO44YV_zVBv10HB04n_CoCZ9LgOOiGhDdnr7_hg/pub?output=csv";
    let activeSheetUrl = localStorage.getItem('sheet_csv_url') || DEFAULT_CSV;

    let posts = [];

    document.getElementById('balanceText').innerText = balance;

    function playCoinSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, ctx.currentTime);
        osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      if (url.length === 11 && !url.includes('/')) return url;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // CSV parser supporting quoted fields with commas
    function parseCSVLine(text) {
      let result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let char = text[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result.map(val => val.replace(/^"|"$/g, ''));
    }

    async function syncSheets() {
      try {
        const res = await fetch(activeSheetUrl);
        if (!res.ok) throw new Error('فشل جلب الشيت');
        const text = await res.text();
        
        const lines = text.split('\n');
        const sheetPosts = [];

        lines.forEach((line, idx) => {
          if (!line.trim()) return;
          const cols = parseCSVLine(line);
          const urlCell = cols[0] ? cols[0].trim() : '';
          const userCell = cols[1] ? cols[1].trim() : ('@مستخدم_' + (idx + 1));
          const verifiedCell = cols[2] ? parseInt(cols[2].trim()) : 0;

          if (!urlCell) return;

          const ytId = extractYouTubeId(urlCell);
          let type = 'image';
          let mediaUrl = urlCell;

          if (ytId) {
            type = 'youtube';
            mediaUrl = ytId;
          } else if (urlCell.match(/\.(mp4|webm|ogg)$/i)) {
            type = 'video';
          }

          sheetPosts.push({
            id: ytId || ('post-' + idx + '-' + Date.now()),
            type: type,
            url: mediaUrl,
            author: userCell,
            verified: verifiedCell === 1,
            desc: 'منشور تفاعلي من Google Sheets ✨',
            likes: Math.floor(Math.random() * 500) + 15
          });
        });

        posts = sheetPosts.length > 0 ? sheetPosts : [{
          id: 'LuP9MoaN-z0',
          type: 'youtube',
          url: 'LuP9MoaN-z0',
          author: '@تيك_توك',
          verified: true,
          desc: 'أهلاً بكم! شاهد هذا الفيديو واكسب 1 دينار 🪙',
          likes: 1200
        }];

        renderFeed();
        showToast('تم تحديث الفيديوهات من الشيت بنجاح!');
      } catch (err) {
        console.log('Error syncing sheet:', err);
        // Fallback default
        posts = [{
          id: 'LuP9MoaN-z0',
          type: 'youtube',
          url: 'LuP9MoaN-z0',
          author: '@تيك_توك',
          verified: true,
          desc: 'أهلاً بكم! شاهد هذا الفيديو واكسب 1 دينار 🪙',
          likes: 1200
        }];
        renderFeed();
      }
    }

    function renderFeed() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      posts.forEach((post, index) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.dataset.index = index;
        card.dataset.id = post.id;

        let mediaHtml = '';
        if (post.type === 'youtube') {
          mediaHtml = `
            <iframe 
              id="yt-${index}"
              src="https://www.youtube.com/embed/${post.url}?enablejsapi=1&autoplay=${index === 0 ? 1 : 0}&mute=1&controls=0&loop=1&playlist=${post.url}&rel=0&playsinline=1"
              allow="autoplay; encrypted-media">
            </iframe>
          `;
        } else if (post.type === 'video') {
          mediaHtml = `<video src="${post.url}" loop muted playsinline></video>`;
        } else {
          mediaHtml = `<img src="${post.url}" alt="Post">`;
        }

        const verifiedBadge = post.verified ? `<i class="fas fa-check-circle" style="color:#00f2fe; font-size:12px;" title="موثق"></i>` : '';

        card.innerHTML = `
          <div class="watch-progress" id="progress-${index}"></div>
          <div class="media-wrapper">
            ${mediaHtml}
          </div>

          <div class="video-overlay">
            <div class="side-bar">
              <div class="action-item" onclick="toggleLike(this)">
                <i class="fas fa-heart"></i>
                <span>${post.likes}</span>
              </div>
              <div class="action-item" onclick="showToast('قسم التعليقات قريباً!')">
                <i class="fas fa-comment-dots"></i>
                <span>${Math.floor(post.likes / 5)}</span>
              </div>
              <div class="action-item" onclick="sharePost('${post.id}')">
                <i class="fas fa-share"></i>
                <span>مشاركة</span>
              </div>
            </div>

            <div class="video-info">
              <div class="username">${post.author} ${verifiedBadge}</div>
              <div class="description">${post.desc}</div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      setupObserver();
    }

    let watchTimer = null;

    function setupObserver() {
      const cards = document.querySelectorAll('.video-card');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const index = entry.target.dataset.index;
          const postId = entry.target.dataset.id;
          const progressBar = document.getElementById(`progress-${index}`);

          if (entry.isIntersecting) {
            if (progressBar) progressBar.style.width = '0%';

            if (!watchedSet.has(postId)) {
              let elapsed = 0;
              clearInterval(watchTimer);
              watchTimer = setInterval(() => {
                elapsed += 100;
                if (progressBar) progressBar.style.width = (elapsed / 5000 * 100) + '%';

                if (elapsed >= 5000) {
                  clearInterval(watchTimer);
                  watchedSet.add(postId);
                  localStorage.setItem('watched_videos', JSON.stringify([...watchedSet]));
                  
                  balance += 1;
                  localStorage.setItem('user_balance', balance);
                  document.getElementById('balanceText').innerText = balance;
                  
                  playCoinSound();
                  const badge = document.getElementById('rewardBadge');
                  badge.classList.add('pop');
                  setTimeout(() => badge.classList.remove('pop'), 400);
                  showToast('+1 دينار تم إضافته لرصيدك!');
                }
              }, 100);
            } else {
              if (progressBar) progressBar.style.width = '100%';
            }
          } else {
            if (progressBar) progressBar.style.width = '0%';
          }
        });
      }, { threshold: 0.6 });

      cards.forEach(card => observer.observe(card));
    }

    function toggleLike(element) {
      const icon = element.querySelector('i');
      const countSpan = element.querySelector('span');
      let count = parseInt(countSpan.innerText);

      if (icon.classList.contains('active')) {
        icon.classList.remove('active');
        countSpan.innerText = count - 1;
      } else {
        icon.classList.add('active');
        countSpan.innerText = count + 1;
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.querySelector('span').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function addManualPost() {
      const url = document.getElementById('inputUrl').value.trim();
      const user = document.getElementById('inputUser').value.trim() || '@مستخدم';
      const verified = parseInt(document.getElementById('inputVerified').value) === 1;

      if (!url) return alert('يرجى إدخال الرابط!');

      const ytId = extractYouTubeId(url);
      const newPost = {
        id: 'custom-' + Date.now(),
        type: ytId ? 'youtube' : (url.match(/\.(mp4|webm)$/i) ? 'video' : 'image'),
        url: ytId || url,
        author: user,
        verified: verified,
        desc: 'منشور مضاف حديثاً 🚀',
        likes: 0
      };

      posts.unshift(newPost);
      renderFeed();
      closeModal('uploadModal');
      showToast('تمت إضافة منشورك بنجاح!');
      document.getElementById('inputUrl').value = '';
      document.getElementById('inputUser').value = '';
    }

    function saveSheetUrl() {
      const url = document.getElementById('sheetUrlInput').value.trim();
      if (url) {
        activeSheetUrl = url;
        localStorage.setItem('sheet_csv_url', url);
        syncSheets();
        closeModal('settingsModal');
      }
    }

    function sharePost(id) {
      if (navigator.share) {
        navigator.share({
          title: 'تيك توك - شاهد واكسب',
          url: window.location.href
        });
      } else {
        showToast('تم نسخ رابط التطبيق!');
      }
    }

    syncSheets();
  </script>
</body>
</html>
