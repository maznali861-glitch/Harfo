<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تيك توك - شاهد واكسب</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }

    .app-header * {
      pointer-events: auto;
    }

    .reward-badge {
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #ffd700;
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: #ffd700;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .reward-badge.pop {
      transform: scale(1.25);
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .feed-container {
      height: 100vh;
      width: 100vw;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    .feed-container::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
      pointer-events: auto;
    }

    .audio-toggle-btn {
      position: absolute;
      top: 80px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      backdrop-filter: blur(5px);
      font-size: 16px;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .video-overlay * {
      pointer-events: auto;
    }

    .side-bar {
      position: absolute;
      left: 15px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #fff;
      cursor: pointer;
    }

    .action-item i {
      font-size: 28px;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
      transition: transform 0.2s;
    }

    .action-item i.active {
      color: #ff0050;
    }

    .action-item span {
      font-size: 12px;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .video-info {
      position: absolute;
      right: 15px;
      bottom: 90px;
      max-width: 75%;
      z-index: 10;
    }

    .username {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .description {
      font-size: 14px;
      line-height: 1.4;
      opacity: 0.9;
    }

    .watch-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 4px;
      background: #ffd700;
      width: 0%;
      transition: width 0.1s linear;
      z-index: 15;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #000;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: rgba(255,255,255,0.6);
      font-size: 10px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #fff;
    }

    .nav-item i {
      font-size: 20px;
    }

    .add-icon-btn {
      width: 45px;
      height: 30px;
      background: #ff0050;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      background: #181818;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #ccc;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #ff0050;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #ffd700;
      color: #000;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 300;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-state {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      color: #aaa;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="toast" id="toast">
    <i class="fas fa-coins"></i>
    <span>حصلت على 1 دينار!</span>
  </div>

  <div class="app-header">
    <div class="reward-badge" id="rewardBadge">
      <i class="fas fa-wallet"></i>
      <span id="balanceText">0</span>
      <span>د.ع</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="syncSheets()" title="تحديث الفيديوهات"><i class="fas fa-sync-alt"></i></button>
    </div>
  </div>

  <div class="feed-container" id="feedContainer"></div>

  <div class="nav-bar">
    <div class="nav-item active">
      <i class="fas fa-home"></i>
      <span>الرئيسية</span>
    </div>
    <div class="nav-item" onclick="openModal('uploadModal')">
      <div class="add-icon-btn"><i class="fas fa-plus"></i></div>
      <span>نشر</span>
    </div>
    <div class="nav-item" onclick="syncSheets()">
      <i class="fas fa-rotate"></i>
      <span>تحديث</span>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>نشر مقطع جديد</h3>
        <i class="fas fa-times" onclick="closeModal('uploadModal')" style="cursor:pointer"></i>
      </div>
      <div class="form-group">
        <label>رابط يوتيوب</label>
        <input type="text" id="inputUrl" class="form-control" placeholder="https://youtube.com/shorts/...">
      </div>
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="inputUser" class="form-control" placeholder="@username">
      </div>
      <button class="btn-submit" onclick="sendToTelegram()">إرسال للمراجعة</button>
    </div>
  </div>

  <script>
    let balance = parseInt(localStorage.getItem('user_balance') || '0');
    let watchedSet = new Set(JSON.parse(localStorage.getItem('watched_videos') || '[]'));
    let posts = [];
    let isMuted = true;

    // ضع رابط الـ Web App الخاص بك هنا بين العلامتين
    const scriptAppUrl = "ضع_رابط_الـ_Web_App_هنا";

    document.getElementById('balanceText').innerText = balance;

    function playCoinSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, ctx.currentTime);
        osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function toggleAudio() {
      isMuted = !isMuted;
      renderFeed();
      showToast(isMuted ? 'تم كتم الصوت 🔇' : 'تم تشغيل الصوت 🔊');
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      if (url.length === 11 && !url.includes('/')) return url;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function syncSheets() {
      showToast('جاري جلب الفيديوهات...');
      try {
        if (!scriptAppUrl || scriptAppUrl.includes("ضع_رابط")) {
          showToast('يرجى وضع رابط الـ Web App في الكود');
          return;
        }
        
        const res = await fetch(scriptAppUrl);
        const data = await res.json();
        
        const sheetPosts = [];
        data.forEach((item, idx) => {
          const ytId = extractYouTubeId(item.url);
          if (ytId) {
            sheetPosts.push({
              id: ytId,
              type: 'youtube',
              url: ytId,
              author: item.author || ('@مستخدم_' + (idx + 1)),
              verified: item.verified,
              desc: 'فيديو تفاعلي من جدول البيانات ✨',
              likes: Math.floor(Math.random() * 500) + 15
            });
          }
        });

        posts = sheetPosts;
        renderFeed();
        showToast('تم تحديث الفيديوهات بنجاح!');
      } catch (err) {
        console.log('Error:', err);
        showToast('تعذر جلب البيانات');
      }
    }

    function renderFeed() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-film" style="font-size: 50px; color: #444;"></i>
            <p>لا توجد فيديوهات في الجدول حالياً.<br>أضف روابط في العمود A لتبدأ بالظهور هنا!</p>
          </div>
        `;
        return;
      }

      posts.forEach((post, index) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.dataset.index = index;
        card.dataset.id = post.id;

        let mediaHtml = `
          <iframe 
            id="yt-${index}"
            src="https://www.youtube.com/embed/${post.url}?enablejsapi=1&autoplay=${index === 0 ? 1 : 0}&mute=${isMuted ? 1 : 0}&controls=0&loop=1&playlist=${post.url}&rel=0&playsinline=1"
            allow="autoplay; encrypted-media">
          </iframe>
        `;

        const verifiedBadge = post.verified ? `<i class="fas fa-check-circle" style="color:#00f2fe; font-size:12px;" title="موثق"></i>` : '';
        const audioBtnHtml = `
          <div class="audio-toggle-btn" onclick="toggleAudio()" title="التحكم بالصوت">
            <i class="fas ${isMuted ? 'fa-volume-mute' : 'fa-volume-up'}"></i>
          </div>
        `;

        card.innerHTML = `
          <div class="watch-progress" id="progress-${index}"></div>
          <div class="media-wrapper">
            ${mediaHtml}
            ${audioBtnHtml}
          </div>

          <div class="video-overlay">
            <div class="side-bar">
              <div class="action-item" onclick="toggleLike(this)">
                <i class="fas fa-heart"></i>
                <span>${post.likes}</span>
              </div>
              <div class="action-item" onclick="showToast('قسم التعليقات متصل بالشيت')">
                <i class="fas fa-comment-dots"></i>
                <span>${Math.floor(post.likes / 5)}</span>
              </div>
              <div class="action-item" onclick="sharePost()">
                <i class="fas fa-share"></i>
                <span>مشاركة</span>
              </div>
            </div>

            <div class="video-info">
              <div class="username">${post.author} ${verifiedBadge}</div>
              <div class="description">${post.desc}</div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      setupObserver();
    }

    let watchTimer = null;

    function setupObserver() {
      const cards = document.querySelectorAll('.video-card');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const index = entry.target.dataset.index;
          const postId = entry.target.dataset.id;
          const progressBar = document.getElementById(`progress-${index}`);

          if (entry.isIntersecting) {
            if (progressBar) progressBar.style.width = '0%';

            if (!watchedSet.has(postId)) {
              let elapsed = 0;
              clearInterval(watchTimer);
              watchTimer = setInterval(() => {
                elapsed += 100;
                if (progressBar) progressBar.style.width = (elapsed / 5000 * 100) + '%';

                if (elapsed >= 5000) {
                  clearInterval(watchTimer);
                  watchedSet.add(postId);
                  localStorage.setItem('watched_videos', JSON.stringify([...watchedSet]));
                  
                  balance += 1;
                  localStorage.setItem('user_balance', balance);
                  document.getElementById('balanceText').innerText = balance;
                  
                  playCoinSound();
                  const badge = document.getElementById('rewardBadge');
                  badge.classList.add('pop');
                  setTimeout(() => badge.classList.remove('pop'), 400);
                  showToast('+1 دينار تم إضافته لرصيدك!');
                }
              }, 100);
            } else {
              if (progressBar) progressBar.style.width = '100%';
            }
          } else {
            if (progressBar) progressBar.style.width = '0%';
          }
        });
      }, { threshold: 0.6 });

      cards.forEach(card => observer.observe(card));
    }

    function toggleLike(element) {
      const icon = element.querySelector('i');
      const countSpan = element.querySelector('span');
      let count = parseInt(countSpan.innerText);

      if (icon.classList.contains('active')) {
        icon.classList.remove('active');
        countSpan.innerText = count - 1;
      } else {
        icon.classList.add('active');
        countSpan.innerText = count + 1;
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.querySelector('span').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    async function sendToTelegram() {
      const url = document.getElementById('inputUrl').value.trim();
      const user = document.getElementById('inputUser').value.trim();

      if (!url || !user) {
        alert('يرجى إدخال الرابط واسم المستخدم!');
        return;
      }

      try {
        showToast('جاري إرسال الطلب...');
        await fetch(scriptAppUrl, {
          method: 'POST',
          body: JSON.stringify({ url: url, user: user })
        });

        closeModal('uploadModal');
        alert('انتظر سيتم مراجعة الفيديو');
        document.getElementById('inputUrl').value = '';
        document.getElementById('inputUser').value = '';
      } catch (e) {
        console.log(e);
        alert('حدث خطأ أثناء الإرسال، تأكد من الاتصال.');
      }
    }

    function sharePost() {
      if (navigator.share) {
        navigator.share({
          title: 'تيك توك - شاهد واكسب',
          url: window.location.href
        });
      } else {
        showToast('تم نسخ رابط التطبيق!');
      }
    }

    syncSheets();
  </script>
</body>
</html>
